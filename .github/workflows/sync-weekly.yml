name: Sync Weekly Content

on:
  # 定时触发：每天凌晨2点（北京时间）
  schedule:
    - cron: '0 18 * * *'  # UTC时间18:00 = 北京时间02:00
  # 手动触发
  workflow_dispatch:

env:
  SOURCE_REPO: 'ruanyf/weekly'
  TARGET_BRANCH: 'nextjs'

jobs:
  sync-content:
    name: 同步周刊内容
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出当前仓库
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 设置 Git 配置
      run: |
        git config --global user.name "Weekly Reader Bot"
        git config --global user.email "weekly-reader@example.com"
    
    - name: 同步内容
      run: |
        echo "🚀 开始同步周刊内容..."
        
        # 创建临时目录
        TEMP_DIR=$(mktemp -d)
        echo "📁 临时目录: $TEMP_DIR"
        
        # 克隆源仓库到临时目录
        echo "📥 克隆源仓库..."
        git clone --depth 1 https://github.com/${{ env.SOURCE_REPO }}.git "$TEMP_DIR/source"
        
        # 切换到工作目录
        cd "$GITHUB_WORKSPACE"
        
        # 同步 docs 目录
        if [ -d "$TEMP_DIR/source/docs" ]; then
          echo "📁 同步 docs 目录..."
          rsync -av --delete "$TEMP_DIR/source/docs/" docs/
        else
          echo "⚠️ 源仓库中没有找到 docs 目录"
        fi
        
        # 同步 README.md
        if [ -f "$TEMP_DIR/source/README.md" ]; then
          echo "📄 同步 README.md..."
          cp "$TEMP_DIR/source/README.md" README.md
        else
          echo "⚠️ 源仓库中没有找到 README.md"
        fi
        
        # 显示同步状态
        echo "📊 同步状态:"
        echo "  - docs/ 目录存在: $([ -d docs ] && echo "是" || echo "否")"
        echo "  - README.md 存在: $([ -f README.md ] && echo "是" || echo "否")"
        
        # 清理临时目录
        rm -rf "$TEMP_DIR"
        
        echo "✅ 同步完成"
    
    - name: 检查变更状态
      id: check-changes
      run: |
        echo "🔍 检查文件变更状态..."
        
        # 显示当前 Git 状态
        echo "📊 Git 状态:"
        git status --short
        
        # 检查是否有变更
        if git diff --quiet && git diff --cached --quiet; then
          echo "ℹ️ 没有检测到文件变更"
          echo "has-changes=false" >> $GITHUB_OUTPUT
        else
          echo "📝 检测到文件变更"
          echo "has-changes=true" >> $GITHUB_OUTPUT
        fi
    
    - name: 提交变更
      if: steps.check-changes.outputs.has-changes == 'true'
      run: |
        echo "📝 准备提交变更..."
        
        # 显示具体变更
        echo "📋 变更详情:"
        git diff --name-status
        
        # 添加变更文件
        git add docs/ README.md
        
        # 检查暂存区状态
        echo "📦 暂存区状态:"
        git status --short
        
        # 生成提交信息
        TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
        COMMIT_MSG="🔄 自动同步周刊内容 - $TIMESTAMP"
        
        # 提交变更
        echo "💾 提交变更..."
        git commit -m "$COMMIT_MSG"
        
        # 拉取最新变更以避免冲突
        echo "🔄 拉取最新变更..."
        git pull --rebase origin ${{ env.TARGET_BRANCH }}

        # 推送到远程仓库
        echo "🚀 推送到远程仓库..."
        git push --force origin ${{ env.TARGET_BRANCH }}
        
        echo "✅ 变更已提交并推送到 ${{ env.TARGET_BRANCH }} 分支"
