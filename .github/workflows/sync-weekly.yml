name: 自动同步周刊内容

on:
  # 定时触发：每天凌晨2点（北京时间）
  schedule:
    - cron: '0 18 * * *'  # UTC时间18:00 = 北京时间02:00
  # 手动触发
  workflow_dispatch:

env:
  SOURCE_REPO: 'ruanyf/weekly'
  TARGET_BRANCH: 'nextjs'

jobs:
  sync-content:
    name: 同步周刊内容
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出当前仓库
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 设置 Git 配置
      run: |
        git config --global user.name "Weekly Reader Bot"
        git config --global user.email "weekly-reader@example.com"
    
    - name: 同步内容
      run: |
        echo "🚀 开始同步周刊内容..."
        
        # 创建临时目录
        TEMP_DIR=$(mktemp -d)
        cd "$TEMP_DIR"
        
        # 克隆源仓库
        echo "📥 克隆源仓库..."
        git clone --depth 1 https://github.com/${{ env.SOURCE_REPO }}.git source
        
        cd "$GITHUB_WORKSPACE"
        
        # 同步 docs 目录
        if [ -d "source/docs" ]; then
          echo "📁 同步 docs 目录..."
          rsync -av --delete source/docs/ docs/
        fi
        
        # 同步 README.md
        if [ -f "source/README.md" ]; then
          echo "📄 同步 README.md..."
          cp source/README.md README.md
        fi
        
        # 清理临时目录
        rm -rf "$TEMP_DIR"
        
        echo "✅ 同步完成"
    
    - name: 检查并提交变更
      run: |
        # 检查是否有变更
        if git diff --quiet; then
          echo "ℹ️ 没有检测到文件变更"
          exit 0
        fi
        
        # 添加变更文件
        git add docs/ README.md
        
        # 生成提交信息
        TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
        COMMIT_MSG="🔄 自动同步周刊内容 - $TIMESTAMP"
        
        # 提交变更
        git commit -m "$COMMIT_MSG"
        
        # 推送到远程仓库
        git push origin ${{ env.TARGET_BRANCH }}
        
        echo "✅ 变更已提交并推送"
